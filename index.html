<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Igor Grygorenko · ZuZzZa</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Igor Grygorenko (ZuZzZa) — maker of ESP32 devices. Download firmware and update your device." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%238b5cf6'/%3E%3Cpath d='M7 16l5-5-5-5M13 17h5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#07060c; --bg-2:#0b0a13; --panel:#100e1b; --panel-2:#151324;
    --text:#e9e7f6; --muted:#9d97c4; --faint:#6f6a93;
    --line:#221f38; --line-2:#322d52;
    --violet:#8b5cf6; --violet-2:#a78bfa; --magenta:#e659d6; --cyan:#38e6d0;
    --good:#37d67a; --good-soft:#0e2a1c; --warn:#f0a83c; --warn-soft:#2a1f0c;
    --glow: 0 0 0 1px rgba(139,92,246,.25), 0 0 30px rgba(139,92,246,.18);
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 82% -8%, rgba(139,92,246,.16), transparent 60%),
      radial-gradient(700px 500px at 5% 8%, rgba(230,89,214,.10), transparent 55%),
      linear-gradient(rgba(139,92,246,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.035) 1px, transparent 1px);
    background-size:auto,auto,44px 44px,44px 44px; background-attachment:fixed; min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;}
  .wrap{max-width:1060px;margin:0 auto;padding:0 22px;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--violet-2);}

  header.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line);}
  .top-in{display:flex;align-items:center;gap:16px;height:64px;}
  .logo{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.01em;}
  .logo .m{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--violet),var(--magenta));box-shadow:var(--glow);}
  .logo .m svg{width:17px;height:17px;}
  .logo .cur{color:var(--magenta);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  nav.links{display:flex;gap:4px;margin-left:auto;}
  nav.links a{font-family:var(--mono);font-size:13px;letter-spacing:.03em;color:var(--muted);padding:8px 14px;border-radius:9px;border:1px solid transparent;transition:.15s;}
  nav.links a:hover{color:var(--text);}
  nav.links a.on{color:var(--violet-2);border-color:var(--line-2);background:var(--panel);}

  .hero{padding:70px 0 34px;}
  .prompt{font-family:var(--mono);color:var(--muted);font-size:14px;margin-bottom:18px;}
  .prompt .g{color:var(--cyan);} .prompt .c{color:var(--violet-2);}
  .hero h1{font-size:clamp(34px,6vw,62px);font-weight:800;letter-spacing:-.03em;margin:6px 0 10px;}
  .hero h1 .hl{background:linear-gradient(120deg,var(--violet-2),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .role{font-family:var(--mono);color:var(--muted);font-size:15px;letter-spacing:.02em;}
  .role b{color:var(--cyan);font-weight:600;}
  .lead{color:var(--muted);font-size:17.5px;max-width:62ch;margin:22px 0 0;}
  .lead b{color:var(--text);font-weight:600;}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;}
  .btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--line-2);color:var(--text);background:var(--panel);transition:.16s;}
  .btn:hover{border-color:var(--violet);box-shadow:var(--glow);transform:translateY(-1px);}
  .btn.pri{background:linear-gradient(140deg,var(--violet),var(--magenta));border-color:transparent;color:#fff;}
  .btn.pri:hover{filter:brightness(1.08);}
  .btn svg{width:15px;height:15px;}

  .stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:44px;}
  .stat{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--violet-2);}
  .stat .l{font-size:12.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}

  .sec-h{display:flex;align-items:center;gap:14px;margin:64px 0 20px;}
  .sec-h h2{font-size:22px;font-weight:750;letter-spacing:-.01em;}
  .sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}
  .sec-h .idx{font-family:var(--mono);color:var(--magenta);font-size:13px;}
  .sec-h .go{font-family:var(--mono);font-size:13px;color:var(--violet-2);display:inline-flex;align-items:center;gap:6px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:40px;}
  .card{position:relative;display:flex;flex-direction:column;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:hidden;transition:.18s;}
  .card::before{content:"";position:absolute;inset:0;border-radius:14px;padding:1px;opacity:0;transition:.2s;background:linear-gradient(140deg,var(--violet),var(--magenta));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
  .card:hover{transform:translateY(-3px);box-shadow:var(--glow);}
  .card:hover::before{opacity:1;}
  .c-top{display:flex;align-items:center;gap:12px;}
  .dev{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(139,92,246,.3),rgba(230,89,214,.12));color:var(--violet-2);border:1px solid var(--line-2);}
  .dev svg{width:22px;height:22px;}
  .card h3{font-size:18px;letter-spacing:-.01em;}
  .card .tag{color:var(--faint);font-size:13px;font-family:var(--mono);}
  .card p{color:var(--muted);font-size:14px;margin:0;flex:1;}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .go{font-family:var(--mono);font-size:12.5px;color:var(--violet-2);display:inline-flex;align-items:center;gap:6px;}
  .card:hover .go svg{transform:translateX(3px);}
  .go svg{width:14px;height:14px;transition:.18s;}

  .pill{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2);}
  .pill.latest{color:var(--good);border-color:transparent;background:var(--good-soft);}
  .pill.soon{color:var(--warn);border-color:transparent;background:var(--warn-soft);}
  .pill.pub{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:transparent;}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .hw{display:flex;flex-wrap:wrap;gap:6px;}
  .hw .chip{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);}

  .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;color:var(--muted);margin:34px 0 20px;transition:.15s;}
  .back:hover{color:var(--violet-2);}
  .back svg{width:15px;height:15px;}
  .p-head{display:flex;gap:18px;align-items:flex-start;padding-bottom:24px;border-bottom:1px solid var(--line);}
  .p-head .dev{width:60px;height:60px;border-radius:15px;}
  .p-head .dev svg{width:31px;height:31px;}
  .p-head h1{font-size:clamp(26px,4vw,36px);font-weight:780;letter-spacing:-.02em;}
  .p-head .tag{color:var(--faint);font-family:var(--mono);font-size:14px;margin-top:4px;}
  .p-head p{color:var(--muted);margin:12px 0 0;max-width:64ch;}
  .p-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;}
  .ghlink{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .ghlink:hover{color:var(--violet-2);} .ghlink svg{width:15px;height:15px;}

  .howto{margin:28px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .howto-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);}
  .howto-h svg{width:18px;height:18px;color:var(--violet-2);}
  .howto-h h2{font-size:15px;font-weight:650;}
  .tabs{display:flex;gap:4px;padding:12px 18px 0;}
  .tab{font-family:var(--mono);font-size:13px;padding:8px 14px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;}
  .tab:hover{color:var(--text);}
  .tab.on{color:var(--violet-2);border-bottom-color:var(--violet);}
  .panes{padding:16px 20px 22px;}
  .pane{display:none;} .pane.on{display:block;animation:fade .25s;}
  .pane ol{margin:0;padding-left:20px;} .pane li{margin:7px 0;color:var(--muted);} .pane li b{color:var(--text);}
  code,.code{font-family:var(--mono);font-size:12.5px;background:var(--bg-2);border:1px solid var(--line-2);padding:1px 6px;border-radius:5px;color:var(--violet-2);}
  pre.code{display:block;padding:12px 14px;overflow-x:auto;margin:10px 0 2px;color:var(--text);line-height:1.5;}

  .rel-title{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:40px 0 10px;}
  .release{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:14px;overflow:hidden;}
  .r-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 20px 2px;}
  .r-top .ver{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--text);}
  .r-top .date{font-family:var(--mono);color:var(--faint);font-size:13px;}
  .r-body{padding:6px 20px 20px;}
  .r-body ul{margin:8px 0 0;padding-left:18px;} .r-body li{margin:5px 0;color:var(--muted);}
  .files{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .files-l{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);}
  .file{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);transition:.15s;}
  .file:hover{border-color:var(--violet);}
  .fic{width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-2);color:var(--violet-2);}
  .fic svg{width:15px;height:15px;}
  .fm{flex:1;min-width:0;}
  .fn{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fs{font-size:11.5px;color:var(--faint);}
  .ft{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;flex:none;letter-spacing:.05em;}
  .ft.ota{background:rgba(56,230,208,.12);color:var(--cyan);}
  .ft.full{background:var(--warn-soft);color:var(--warn);}
  .ft.file{background:var(--panel-2);color:var(--muted);}
  .dl{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:#fff;flex:none;background:linear-gradient(140deg,var(--violet),var(--magenta));transition:.15s;}
  .dl:hover{filter:brightness(1.1);}
  .dl svg{width:13px;height:13px;}
  .empty{padding:28px 20px;text-align:center;color:var(--faint);border:1px dashed var(--line-2);border-radius:14px;background:var(--panel);}
  .note{font-size:13px;color:var(--faint);background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--warn);padding:10px 14px;border-radius:8px;margin:14px 0;}
  .loading{padding:60px 0;text-align:center;color:var(--faint);font-family:var(--mono);}
  .loading .sp{width:26px;height:26px;border:2px solid var(--line-2);border-top-color:var(--violet);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;margin-bottom:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 0;color:var(--faint);font-family:var(--mono);font-size:12.5px;}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  #app{animation:fade .3s;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media (max-width:560px){.file{flex-wrap:wrap;}.dl{width:100%;justify-content:center;}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#/">
      <span class="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg></span>
      <span>ZuZzZa<span class="cur">_</span></span>
    </a>
    <nav class="links" id="nav">
      <a href="#/" data-r="home">~/about</a>
      <a href="#/firmware" data-r="fw">~/firmware</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap"><div class="loading"><span class="sp"></span><br>loading…</div></main>

<footer><div class="wrap"><span>// built on ESP32, shipped over the air</span><span>Igor Grygorenko · ZuZzZa © 2026</span></div></footer>

<script>
const I={
  antenna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21l7-9 7 9M12 12V3M8 6a5.6 5.6 0 0 1 8 0M6 3.5a9 9 0 0 1 12 0"/></svg>',
  hub:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="8" rx="1.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1.2 1.5 1.4 2.5h5.2c.2-1 .7-1.8 1.4-2.5A6 6 0 0 0 12 3z"/></svg>',
  radio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8M8 12l4-4 4 4M6 4h12"/></svg>',
  gh:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.93.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  twitch:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2 3 6v13h4v3h3l3-3h4l5-5V2H4zm16 10-3 3h-4l-3 3v-3H7V4h13v8zM16 7h-2v5h2V7zm-5 0H9v5h2V7z"/></svg>',
};

let DATA={owner:"ZuZzZa",person:{},projects:[]};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const latestOf=(p)=>p.releases.find(r=>r.latest)||p.releases[0];

/* ── live GitHub releases for public repos ── */
function human(b){ if(!b&&b!==0) return ''; if(b>=1048576) return (b/1048576).toFixed(1)+' MB'; if(b>=1024) return Math.round(b/1024)+' KB'; return b+' B'; }
function boardFromName(n){ n=n.toLowerCase(); if(n.includes('wroom')) return 'ESP32-WROOM-32'; if(n.includes('ttgo')) return 'TTGO T-Display'; return ''; }
function typeFromName(n){ if(/_full\.bin$/i.test(n)) return 'full'; if(/\.bin$/i.test(n)) return 'ota'; return 'file'; }
function bodyToNotes(body){
  if(!body) return [];
  const lines=body.split(/\r?\n/).map(l=>l.trim())
    .filter(l=>l && !/^#{1,6}\s/.test(l) && !/^-{3,}$/.test(l))
    .map(l=>l.replace(/^[-*]\s+/,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/`(.+?)`/g,'$1'));
  return lines.slice(0,6);
}
async function loadPublic(p){
  try{
    const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(DATA.owner)}/${encodeURIComponent(p.repo)}/releases?per_page=20`,{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error(r.status);
    const rels=(await r.json()).filter(x=>!x.draft);
    p.releases=rels.map((x,i)=>({
      version:(x.tag_name||'').replace(/^v/,''),
      date:(x.published_at||x.created_at||'').slice(0,10),
      latest:i===0 && !x.prerelease,
      notes:bodyToNotes(x.body),
      url:x.html_url,
      files:(x.assets||[]).map(a=>({name:a.name,type:typeFromName(a.name),board:boardFromName(a.name),size:human(a.size),url:a.browser_download_url}))
    }));
    p._live=true;
  }catch(e){ p._liveErr=true; }
}

/* ── views ── */
function projCard(p){
  const lr=latestOf(p);
  const badge=lr?`<span class="pill latest"><span class="d"></span>v${esc(lr.version)}</span>`
    :(p.vis==="public"?`<span class="pill pub"><span class="d"></span>public</span>`:`<span class="pill soon">coming soon</span>`);
  return `<a class="card" href="#/p/${p.id}">
    <div class="c-top"><div class="dev">${I[p.icon]||I.chip}</div><div><h3>${esc(p.name)}</h3><div class="tag">${esc(p.tag)}</div></div></div>
    <p>${esc(p.desc)}</p>
    <div class="hw">${p.hw.map(h=>`<span class="chip">${esc(h)}</span>`).join('')}</div>
    <div class="foot">${badge}<span class="go">open ${I.arrow}</span></div></a>`;
}
function homeView(){
  const per=DATA.person||{};
  const twitchList=Array.isArray(per.twitch)?per.twitch:(per.twitch?[{label:'Twitch',url:per.twitch}]:[]);
  const links=[
    per.github?`<a class="btn" href="${esc(per.github)}" target="_blank" rel="noopener">${I.gh} GitHub</a>`:'',
    ...twitchList.map(t=>`<a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">${I.twitch} ${esc(t.label||'Twitch')}</a>`),
    per.linktree?`<a class="btn" href="${esc(per.linktree)}" target="_blank" rel="noopener">${I.link} Links</a>`:''
  ].join('');
  return `
  <section class="hero">
    <div class="prompt"><span class="g">zuzzza@devlab</span>:<span class="c">~</span>$ whoami</div>
    <div class="eyebrow">Delivery &amp; Project Manager · Maker</div>
    <h1>I ship projects by day,<br><span class="hl">build devices</span> by night.</h1>
    <div class="role">// MSc Robotics &amp; AI · <b>ESP32</b> · web dev · 3D print · Twitch</div>
    <p class="lead">I'm <b>Igor Grygorenko</b> (ZuZzZa) — MSc in Robotics &amp; AI from Igor Sikorsky KPI. By day I lead delivery as a Project / Delivery Manager; off the clock I build embedded gadgets, do web development, and design &amp; 3D-print hardware. I also stream on Twitch (currently on pause). This is home base — about me here, firmware for my devices on the next tab.</p>
    <div class="cta-row">
      <a class="btn pri" href="#/firmware">${I.up} Get firmware</a>
      ${links}
    </div>
    <div class="stats">
      <div class="stat"><div class="n">MSc</div><div class="l">Robotics &amp; AI · KPI</div></div>
      <div class="stat"><div class="n">PM</div><div class="l">delivery lead</div></div>
      <div class="stat"><div class="n">${DATA.projects.length}</div><div class="l">ESP32 devices</div></div>
      <div class="stat"><div class="n">3D</div><div class="l">model &amp; print</div></div>
    </div>
  </section>
  <div class="sec-h"><span class="idx">01</span><h2>Devices</h2><span class="rule"></span><a class="go" href="#/firmware">all firmware ${I.arrow}</a></div>
  <section class="grid">${DATA.projects.map(projCard).join('')}</section>`;
}
function firmwareView(){
  return `
  <div class="sec-h" style="margin-top:44px"><span class="idx">~/firmware</span><h2>Firmware &amp; releases</h2><span class="rule"></span></div>
  <p style="color:var(--muted);max-width:62ch;margin:0 0 8px">Choose your device, download the latest build, and follow the update guide on its page. Every release keeps its changelog and files.</p>
  <section class="grid" style="padding-top:20px">${DATA.projects.map(projCard).join('')}</section>`;
}
function fileRow(f){
  const sub=f.type==='ota'?'Web-UI update':(f.type==='full'?'Flash at 0x0 (new / bricked)':'Release asset');
  const label=f.type==='ota'?'OTA':(f.type==='full'?'FULL':'FILE');
  const href=f.url||f.path||'#';
  return `<div class="file"><div class="fic">${I.chip}</div>
    <div class="fm"><div class="fn">${esc(f.name)}</div><div class="fs">${[esc(f.board),sub,esc(f.size)].filter(Boolean).join(' · ')}</div></div>
    <span class="ft ${f.type}">${label}</span>
    <a class="dl" href="${esc(href)}"${/^https?:/i.test(href)?'':' download'} rel="noopener">${I.dl} Get</a></div>`;
}
function relCard(r){
  const files=r.files&&r.files.length?`<div class="files"><div class="files-l">Firmware files</div>${r.files.map(fileRow).join('')}</div>`
    :`<div class="note">No downloadable files for this release${r.url?` — <a class="ghlink" href="${esc(r.url)}" target="_blank" rel="noopener" style="display:inline">see it on GitHub</a>`:''}.</div>`;
  return `<article class="release"><div class="r-top"><span class="ver">v${esc(r.version)}</span>${r.latest?'<span class="pill latest"><span class="d"></span>latest</span>':''}<span class="date">${esc(r.date)}</span></div>
    <div class="r-body">${r.notes&&r.notes.length?`<ul>${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${files}</div></article>`;
}
function projectView(id){
  const p=DATA.projects.find(x=>x.id===id); if(!p){location.hash='#/firmware';return '';}
  const lr=latestOf(p);
  const badge=lr?`<span class="pill latest"><span class="d"></span>latest v${esc(lr.version)}</span>`
    :(p.vis==="public"?`<span class="pill pub"><span class="d"></span>public repo</span>`:`<span class="pill soon">coming soon</span>`);
  const ghurl=p.repo?`https://github.com/${DATA.owner}/${p.repo}`:null;
  const releases=p.releases.length?p.releases.map(relCard).join('')
    :`<div class="empty">${p._liveErr?'Could not reach GitHub right now — try again shortly.':'No releases published yet. Firmware appears here on the first tagged release.'}</div>`;
  return `
  <a class="back" href="#/firmware">${I.back} ~/firmware</a>
  <div class="p-head"><div class="dev">${I[p.icon]||I.chip}</div><div>
    <h1>${esc(p.name)}</h1><div class="tag">${esc(p.tag)}</div><p>${esc(p.desc)}</p>
    <div class="p-meta">${badge}<div class="hw">${p.hw.map(h=>`<span class="chip">${esc(h)}</span>`).join('')}</div>
      ${p.vis==='public'&&ghurl?`<a class="ghlink" href="${ghurl}" target="_blank" rel="noopener">${I.gh} source</a>`:''}</div>
  </div></div>
  <div class="howto"><div class="howto-h">${I.up}<h2>How to update your device</h2></div>
    <div class="tabs"><button class="tab on" data-tab="ota">Over-the-air</button><button class="tab" data-tab="full">Full flash (USB)</button></div>
    <div class="panes">
      <div class="pane on" data-pane="ota"><ol>
        <li>Power the device and open its web dashboard.</li>
        <li>Download the <b>OTA</b> file for your board (plain <code>_&lt;board&gt;.bin</code>).</li>
        <li>Open <b>Update</b>, choose the <code>.bin</code>, confirm.</li>
        <li>It flashes and reboots itself — keep the power on.</li></ol></div>
      <div class="pane" data-pane="full"><ol>
        <li>Install <code>esptool</code> and connect over USB.</li>
        <li>Download the <b>FULL</b> image (<code>_full.bin</code>).</li>
        <li>Flash at <code>0x0</code>:<pre class="code">esptool.py -p &lt;PORT&gt; write_flash 0x0 &lt;file&gt;_full.bin</pre></li>
        <li>Reset. Use for new/bricked boards; OTA covers normal updates.</li></ol></div>
    </div></div>
  <div class="rel-title">// releases</div>${releases}`;
}
function setNav(r){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));}
function render(){
  const app=document.getElementById('app');const h=location.hash||'#/';const m=h.match(/^#\/p\/(.+)$/);
  if(m){app.innerHTML=projectView(m[1]);setNav('fw');}
  else if(h==='#/firmware'){app.innerHTML=firmwareView();setNav('fw');}
  else{app.innerHTML=homeView();setNav('home');}
  window.scrollTo(0,0);
  app.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{const k=t.dataset.tab;app.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));app.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.dataset.pane===k));}));
}
window.addEventListener('hashchange',render);

/* ── boot ── */
(async function(){
  try{
    const r=await fetch('data.json',{cache:'no-cache'});
    DATA=await r.json();
  }catch(e){
    document.getElementById('app').innerHTML='<div class="empty" style="margin-top:60px">Could not load data.json.</div>';
    return;
  }
  await Promise.all(DATA.projects.filter(p=>p.vis==='public'&&p.repo).map(loadPublic));
  render();
})();
</script>
</body>
</html>
